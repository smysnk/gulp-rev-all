server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  location = /projects/gulp-rev-all/docs/build-metadata.json {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location ~* \.(?:css|gif|ico|jpe?g|js|json|png|svg|txt|webp|woff2?)$ {
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  location /projects/gulp-rev-all/docs/ {
    add_header Cache-Control "public, max-age=60, must-revalidate" always;
    try_files $uri/index.html $uri =404;
  }

  location / {
    return 404;
  }
}
